project_id = "tikdog"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true
additional_redirect_urls = ["tikdog://auth/callback"]

[auth.email]
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.delete-account]
verify_jwt = false

[functions.delete-video]
verify_jwt = false

[functions.apple-credentials]
verify_jwt = false
